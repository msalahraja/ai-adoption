    <!-- Text Content -->
    <div class="text-content">
      <div class="heading-wrapper">
        <div class="start-here-text">Start here</div>
        <h1 class="main-heading">Using Figma to Code Plugin</h1>
      </div>

      <!-- Get Started Form -->
      <form [formGroup]="getStartedForm" (ngSubmit)="onSubmit()" class="get-started-form">
        <div class="form-group">
          <input
            type="text"
            formControlName="name"
            class="form-input"
            [class.invalid]="submitted && f['name'].errors"
            placeholder="Your name"
          />
          <div class="error-message" *ngIf="submitted && f['name'].errors">
            <span *ngIf="f['name'].errors['required']">Name is required</span>
            <span *ngIf="f['name'].errors['minlength']">Name must be at least 2 characters</span>
          </div>
        </div>

        <div class="form-group">
          <input
            type="email"
            formControlName="email"
            class="form-input"
            [class.invalid]="submitted && f['email'].errors"
            placeholder="Your email"
          />
          <div class="error-message" *ngIf="submitted && f['email'].errors">
            <span *ngIf="f['email'].errors['required']">Email is required</span>
            <span *ngIf="f['email'].errors['email']">Please enter a valid email</span>
          </div>
        </div>

        <button type="submit" class="submit-button">
          <span *ngIf="!successMessage">Get Started</span>
          <span *ngIf="successMessage" class="success-text">✓ Success!</span>
        </button>
      </form>
    </div>
