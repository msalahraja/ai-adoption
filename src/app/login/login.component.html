    <div class="form-container">
      <button class="back-button" (click)="onBack()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8.00065 12.6673L3.33398 8.00065L8.00065 3.33398" stroke="#4A5565" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12.6673 8H3.33398" stroke="#4A5565" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Back</span>
      </button>

      <div class="login-card">
        <div class="card-header">
          <h2 class="welcome-heading">Welcome</h2>
          <p class="welcome-subheading">Sign in to your account to continue</p>
        </div>

        <form class="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input 
              class="form-input" 
              type="email" 
              id="email" 
              placeholder="you@example.com"
            />
          </div>

          <div class="form-group">
            <div class="password-label-row">
              <label class="form-label" for="password">Password</label>
              <button 
                type="button" 
                class="forgot-password-link" 
                (click)="onForgotPassword()"
              >
                Forgot Password?
              </button>
            </div>
            <input 
              class="form-input" 
              type="password" 
              id="password" 
              placeholder="••••••••"
            />
          </div>

          <button type="submit" class="sign-in-button" (click)="onSignIn()">
            Sign In
          </button>
        </form>

        <div class="sign-up-prompt">
          <span class="prompt-text">Don't have an account?</span>
          <button class="sign-up-link" (click)="onSignUp()">Sign Up</button>
        </div>
      </div>
    </div>
  </div>
</div>
